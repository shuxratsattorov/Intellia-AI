name: Intellia CI/CD Pipeline

on:
  push:
    branches: [rollback-commit, production]
  pull_request:
    branches: [production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intellia-backend

jobs:
  # ── JOB 1: TEST & LINT ──────────────────────────────────────
  test:
    name: 🧪 Test & Lint aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite ruff

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check app/ --select=E,W,F --ignore=E501

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -v


  # ── JOB 2: BUILD DOCKER IMAGE ───────────────────────────────
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── JOB 3: DEPLOY TO SERVER ─────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "📦 Pulling latest code..."
            cd /opt/intellia
            git pull origin master

            echo "🐳 Pulling latest Docker images..."
            docker compose pull

            echo "🔄 Restarting backend..."
            docker compose up -d --no-deps --build backend

            echo "🚀 Restarting nginx..."
            docker compose up -d nginx

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "✅ Health check..."
            sleep 5
            curl -f http://localhost/health || exit 1

            echo "🎉 Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check logs."
