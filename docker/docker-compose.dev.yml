services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    container_name: intellia_db_dev
    env_file: 
      - .env.dev
    ports:
      - 15432:5432   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 1800s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
      
  # ── API Backend ───────────────────────────────────────
  api:
    build:
      context: ./backend_dev
    container_name: intellia_api_dev
    environment:
      DEBUG: -false
    env_file:
      - .env.dev
    port:
      -443:443
    volumes:
    - ./media:/app/media   
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 1800s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 

  # ── Nginx Reverse Proxy + Frontend ────────────────────────
  nginx:
    container_name: intellia_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 