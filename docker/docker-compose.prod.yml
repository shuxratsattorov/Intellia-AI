services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    container_name: intellia_db
    env_file: 
      - .env   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
      

  # ── API Backend ───────────────────────────────────────
  api:
    build:
      context: ./backend
    container_name: intellia_api
    environment:
      DEBUG: -true
    env_file:
      - .env  
    volumes:
    - ./media:/app/media   
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 5    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"    

  # ── Nginx Reverse Proxy + Frontend ────────────────────────
  nginx:
    container_name: intellia_nginx  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5" 
