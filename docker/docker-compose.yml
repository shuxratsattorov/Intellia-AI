services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: intellia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      POSTGRES_NAME: ${POSTGRES_NAME}
    env_file: 
      - .env  
    ports:
      - 15432:5432 
    networks:
      - intellia_net   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
      

  # ── API Backend ───────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: intellia_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      DEBUG: ${DEBUG:-false}
    env_file:
      - .env  
    port:
      -443:443
    networks:
      - intellia_net
    volumes:
    - ./media:/app/media   
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 5    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"    

  # ── Nginx Reverse Proxy + Frontend ────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: intellia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - intellia_net  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5" 

volumes:
  postgres_data:
    driver: local

networks:
  intellia_net:
    driver: bridge
