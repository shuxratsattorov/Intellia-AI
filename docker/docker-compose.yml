services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: intellia_db
    restart: unless-stopped
    env_file:
      - ../.env  
      # - path: .env
      #   required: false
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}  
    ports:
      - 15432:5432 
    networks:
      - intellia_net   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"   

  # ── Redis Cache ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: intellia_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    networks:
      - intellia_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"      

  # ── Redis UI ───────────────────────────────────────
  redis_gui:
    image: redis/redisinsight
    container_name: redis_gui
    restart: unless-stopped
    ports:
      - 5540:5540
    networks:
      - intellia_net  

 # ── RabbitMQ ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: intellia_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    networks:
      - intellia_net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"       

  # ── API Backend ───────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: intellia_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      DEBUG: ${DEBUG:-false}
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    networks:
      - intellia_net
    volumes:
      - ../:/app
      - ./media:/app/media   
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy 
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload     
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 5    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"    

 # ── Celery Worker ─────────────────────────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: intellia_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-admin}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    env_file:
      - ../.env
    networks:
      - intellia_net
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

